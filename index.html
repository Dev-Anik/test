<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/mitt/dist/mitt.umd.js"></script>
</head>

<body>
    <input id="userInput" type="text" autofocus />
    <br>
    <div class="test">

        <input id="scannerInput" type="text" value="barcodescan" autofocus />
    </div>

    <script>
        function createEmitter() {
            const handlers = {};
            return {
                on(type, fn) {
                    (handlers[type] || = []).push(fn)
                },
                emit(type, evt) {
                    (handlers[type] || []).forEach(fn => fn(evt))
                }
            };
        }

        const events = createEmitter();

        class BarcodeScanner {
            constructor() {
                this.buffer = "";
                this.timeout = null;
                this.delay = 20; // 20ms gap finishes scan
            }

            initialize() {
                document.addEventListener("keydown", this.onKey);
            }

            close() {
                document.removeEventListener("keydown", this.onKey);
            }

            onKey = (e) => {

                if (this.timeout) clearTimeout(this.timeout);

                // Catch all characters
                let ch = "";

                if (e.key && e.key.length === 1) {
                    ch = e.key;
                } else if (e.keyCode || e.which) {
                    ch = String.fromCharCode(e.keyCode || e.which);
                }

                if (ch) {
                    this.buffer += ch;
                }

                // Reset timer
                this.timeout = setTimeout(() => this.finish(), this.delay);
            }

            finish() {
                if (this.buffer.length > 3) {
                    events.emit("onbarcodescaned", this.buffer);
                }

                this.buffer = "";
            }
        }

        // Usage
        const scanner = new BarcodeScanner();
        scanner.initialize();

        events.on("onbarcodescaned", (code) => {
            alert("SCANNED: " + code); // You said alert shows empty, now it won't
        });
    </script>

</body>

</html>
