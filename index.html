<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Barcode Test</title>
</head>
<body>

<input type="text" placeholder="Type here manually">

<script src="https://unpkg.com/onscan.js/onscan.min.js"></script>
<script>
    onscan.attachTo(document, {
        onScan: function(barcode){
            alert("Scanned Code: " + barcode);
        },
        minLength: 4,
        onKeyDetect: function(event){
            // console.log("Key detected:", event.key);
        }
    });
</script>

</body>
</html>
