<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Scan</title>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/onscan.js@1.5.2/onscan.min.js"></script>

<script>
  console.log("onscan loaded:", typeof onscan); // should print "function"

  onscan.attachTo(document, {
    onScan: function(barcode){
      alert("Scanned: " + barcode);
    },
    minLength: 3,
    scanTimeout: 50
  });
</script>

</body>
</html>
