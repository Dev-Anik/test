<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="userInput" type="text" autofocus />
    <br>
    <div class="test">

        <input id="scannerInput" type="text" value="barcodescan" autofocus />
    </div>

    <script>
        // Source - https://stackoverflow.com/a/56540835
        // Posted by MisieQQQ, modified by community. See post 'Timeline' for change history
        // Retrieved 2025-12-06, License - CC BY-SA 4.0

        const events = mitt();  // event system

class BarcodeScanner {

    constructor() {
        this.timeoutHandler = null;
        this.buffer = "";
        this.scanDelay = 15;   // ms gap that decides scan finished
    }

    initialize() {
        document.addEventListener("keypress", this.onKeyPress);
    }

    close() {
        document.removeEventListener("keypress", this.onKeyPress);
    }

    onKeyPress = (event) => {
        // Each key typed → clear previous timeout
        if (this.timeoutHandler) {
            clearTimeout(this.timeoutHandler);
        }

        // Add typed character
        this.buffer += event.key;

        // Start timeout again
        this.timeoutHandler = setTimeout(() => {
            this.finishScan();
        }, this.scanDelay);
    }

    finishScan() {
        if (this.buffer.length > 3) {
            // Emit scanned barcode
            events.emit("onbarcodescaned", this.buffer);
        }

        // Reset buffer for next scan
        this.buffer = "";
    }
}


const scanner = new BarcodeScanner();

scanner.initialize();

events.on("onbarcodescaned", (code) => {
    alert("Barcode:", code);
});
    </script>
</body>

</html>
